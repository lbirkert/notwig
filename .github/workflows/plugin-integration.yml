name: Plugin Integration

# Manual-only: this suite builds native plugin bundles, installs AU components,
# opens AppKit editor windows, and can take a long time to run. The default
# matrix covers Intel/Apple Silicon macOS plus Linux and Windows.
on:
  workflow_dispatch:
    inputs:
      runners:
        description: >-
          JSON array of runner labels. Defaults to Intel/Apple Silicon macOS,
          Linux, and Windows; add or replace labels for other hosts.
        required: true
        type: string
        default: '["macos-15-intel", "macos-15", "ubuntu-24.04", "windows-2025"]'
      run_lv2:
        description: Install lilv and run LV2 integration tests (Linux/macOS only).
        required: true
        type: boolean
        default: true
      run_au3:
        description: >-
          Run AU v3 when APPLE_DEVELOPER_ID_P12 and
          APPLE_DEVELOPER_ID_PASSWORD secrets are configured. AU v3 requires a
          Developer ID identity with a team ID.
        required: true
        type: boolean
        default: true
      run_editor:
        description: >-
          Run macOS native plugin editor window tests. These open real AppKit
          windows and may abort on hosted runners without a usable GPU/UI
          session; leave off for CI.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: plugin-integration-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_TRUCE_VERSION: 6.3.0

jobs:
  plugin-integration:
    name: Plugin integration (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    env:
      # Secrets cannot be referenced directly in `if:`; expose them as env so
      # the optional AU v3 signing step can check them.
      APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
      APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Report runner
        shell: bash
        run: |
          uname -a
          rustc --version
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            sw_vers
            xcodebuild -version
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Save the dependency/target/bin cache even when a later integration
          # test fails; its post step defaults to success-only.
          cache-on-failure: true

      # Swatinem/rust-cache covers cargo/target state, but keep an explicit
      # cargo-truce entry so a failed test run still persists the tool itself.
      # Version and runner architecture are part of the key; bump
      # CARGO_TRUCE_VERSION to invalidate it. Restore and save are separate
      # because actions/cache only saves at job end on success.
      - name: Restore cached cargo-truce
        id: cargo-truce-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-truce*
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-truce-${{ env.CARGO_TRUCE_VERSION }}

      - name: Install cargo-truce
        if: steps.cargo-truce-cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install cargo-truce --version "${{ env.CARGO_TRUCE_VERSION }}" --locked

      - name: Verify cargo-truce
        shell: bash
        run: cargo truce help >/dev/null

      - name: Save cargo-truce cache
        if: steps.cargo-truce-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-truce*
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-truce-${{ env.CARGO_TRUCE_VERSION }}

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          packages=(
            build-essential cmake ninja-build pkg-config
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libgl1-mesa-dev
            libasound2-dev
          )
          if [[ "${{ inputs.run_lv2 }}" == "true" ]]; then
            packages+=(liblilv-dev lv2-dev)
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Install lilv for LV2
        if: ${{ runner.os == 'macOS' && inputs.run_lv2 }}
        run: brew install lilv pkg-config

      - name: Import Developer ID certificate for AU v3
        id: signing
        if: ${{ runner.os == 'macOS' && inputs.run_au3 && env.APPLE_DEVELOPER_ID_P12 != '' }}
        run: |
          set -euo pipefail
          keychain_password="$(uuidgen)"
          keychain="$RUNNER_TEMP/notwig-signing.keychain-db"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$keychain" \
            -P "$APPLE_DEVELOPER_ID_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
            | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "::error::No Developer ID Application identity found in the imported certificate."
            exit 1
          fi
          echo "TRUCE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "enabled=1" >> "$GITHUB_OUTPUT"
          echo "AU v3 signing identity: $identity"

      - name: Note AU v3 skip
        if: ${{ runner.os == 'macOS' && inputs.run_au3 && env.APPLE_DEVELOPER_ID_P12 == '' }}
        run: |
          echo "::notice::AU v3 integration skipped. Configure APPLE_DEVELOPER_ID_P12 and APPLE_DEVELOPER_ID_PASSWORD secrets to enable it."

      - name: Run plugin integration suite
        shell: bash
        env:
          # lilv is not installed on Windows runners, so LV2 is Linux/macOS only.
          NOTWIG_PLUGIN_TEST_LV2: ${{ runner.os != 'Windows' && inputs.run_lv2 && '1' || '0' }}
          NOTWIG_PLUGIN_TEST_AU3: ${{ steps.signing.outputs.enabled || '0' }}
          NOTWIG_PLUGIN_TEST_EDITOR: ${{ inputs.run_editor && '1' || '0' }}
        run: scripts/test-plugins.sh

      - name: Remove temporary signing keychain
        if: ${{ always() && runner.os == 'macOS' && steps.signing.outputs.enabled == '1' }}
        run: security delete-keychain "$RUNNER_TEMP/notwig-signing.keychain-db" || true
