name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  extensions:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: wasm
            slug: wasm
            rust_targets: wasm32-unknown-unknown
          - os: macos-15
            target: macos-aarch64
            slug: macos-arm64
            rust_targets: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      # This job is also a minimal recipe for building an extension in CI:
      # 1. install the packaging CLI from this workspace
      # 2. build one target entrypoint on the matching runner
      # 3. package the artifacts present in target/ into the publishable ZIP
      - name: Install notwig-ext-cli
        run: cargo install --path crates/notwig-ext/notwig-ext-cli --locked

      - name: Build extension entrypoint
        run: >-
          notwig-ext-cli build --entrypoint "${{ matrix.target }}"
          --path crates/notwig-ext/notwig-ext-devices

      - name: Package stock extension
        run: >-
          notwig-ext-cli build --package "${{ matrix.target }}"
          --path crates/notwig-ext/notwig-ext-devices
          --out-dir docs/extensions
          --name "ext-devices-${{ matrix.slug }}"

      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.target }}
          path: docs/extensions/*.zip
          if-no-files-found: error

  build:
    needs: extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          pattern: extension-*
          path: docs/extensions
          merge-multiple: true

      - name: Build extension index
        run: ./scripts/build-extensions.sh

      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build docs
        run: mdbook build

      - name: Build web app
        run: |
          mkdir -p book/app
          wasm-pack build crates/notwig-web \
            --target web \
            --release \
            --out-dir "$GITHUB_WORKSPACE/book/app/pkg" \
            --out-name notwig_web
          cp web/index.html book/app/index.html
          cp web/styles.css book/app/styles.css

      - name: Add extension assets
        run: |
          mkdir -p book/extensions
          cp docs/extensions.json book/extensions.json
          cp docs/extensions/*.zip book/extensions/
          cp docs/extensions/*.png book/extensions/

      - name: Add Pages metadata
        run: |
          printf 'notwig.lbirkert.com\n' > book/CNAME
          touch book/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
