<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notwig</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="notwig-canvas"></canvas>
    <div id="loading" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <span>Loading Notwig…</span>
    </div>
    <button id="enable-audio" type="button" hidden>Click to enable audio</button>
    <script type="module">
      import init, { WebApp } from "./pkg/notwig_web.js";

      const canvas = document.getElementById("notwig-canvas");
      const loading = document.getElementById("loading");
      const enableAudio = document.getElementById("enable-audio");

      window.__notwigDragPos = null;
      const recordDragPosition = (event) => {
        const rect = canvas.getBoundingClientRect();
        window.__notwigDragPos = [event.clientX - rect.left, event.clientY - rect.top];
      };
      canvas.addEventListener("dragover", recordDragPosition);
      canvas.addEventListener("drop", recordDragPosition);
      window.__notwigTakeDragPos = () => {
        const position = window.__notwigDragPos;
        window.__notwigDragPos = null;
        return position;
      };

      try {
        await init();
        const app = new WebApp();
        await app.start(canvas);
        loading.remove();
        enableAudio.hidden = false;
        enableAudio.addEventListener("click", () => {
          enableAudio.remove();
          app.enable_audio();
        });
      } catch (error) {
        loading.classList.add("failed");
        loading.replaceChildren("Failed to start Notwig.");
        console.error(error);
      }
    </script>
  </body>
</html>
