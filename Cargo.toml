[workspace]
resolver = "2"
exclude = ["crates/notwig-rack"]
members = [
  "crates/notwig-core",
  "crates/notwig-project",
  "crates/notwig-ext/notwig-ext-api",
  "crates/notwig-ext/cargo-notwig-ext",
  "crates/notwig-ext/notwig-ext-devices",
  "crates/notwig-ext/notwig-ext-example",
  "crates/notwig-ext/notwig-ext-macros",
  "crates/notwig-engine",
  "crates/notwig-plugins",
  "crates/notwig-ext/notwig-ext",
  "crates/notwig-ui",
  "crates/notwig-app",
  "crates/notwig-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/lbirkert/notwig"

[workspace.dependencies]
notwig-core = { path = "crates/notwig-core" }
notwig-project = { path = "crates/notwig-project" }
notwig-ext-api = { path = "crates/notwig-ext/notwig-ext-api" }
notwig-ext-devices = { path = "crates/notwig-ext/notwig-ext-devices" }
notwig-ext-macros = { path = "crates/notwig-ext/notwig-ext-macros" }
notwig-engine = { path = "crates/notwig-engine" }
notwig-plugins = { path = "crates/notwig-plugins" }
notwig-ext = { path = "crates/notwig-ext/notwig-ext" }
notwig-ui = { path = "crates/notwig-ui" }
notwig-app = { path = "crates/notwig-app" }
notwig-web = { path = "crates/notwig-web" }

clap = { version = "4", features = ["derive"] }
crossbeam-queue = "0.3"
eframe = { version = "0.32", default-features = false, features = [
  "default_fonts",
  "glow",
  "wayland",
  "wgpu",
] }
egui = "0.32"
cpal = { version = "0.18", features = ["wasm-bindgen"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
mouse_position = "0.1"
wgpu = { version = "25", features = ["metal", "webgpu"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "AudioBuffer",
  "AudioContext",
  "AudioContextOptions",
  "AudioNode",
  "AudioParam",
  "AudioProcessingEvent",
  "Blob",
  "BlobPropertyBag",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "FileSystemCreateWritableOptions",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetDirectoryOptions",
  "FileSystemGetFileOptions",
  "FileSystemHandle",
  "FileSystemHandlePermissionDescriptor",
  "FileSystemRemoveOptions",
  "FileSystemWritableFileStream",
  "GainNode",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "MediaDeviceInfo",
  "MediaDeviceKind",
  "MediaDevices",
  "MediaStream",
  "MediaStreamAudioSourceNode",
  "MediaStreamConstraints",
  "MediaStreamTrack",
  "MediaTrackConstraints",
  "Navigator",
  "Node",
  "Request",
  "RequestCache",
  "RequestInit",
  "Response",
  "ScriptProcessorNode",
  "Storage",
  "StorageManager",
  "Url",
  "Window",
] }
web-time = "1.1"
tracing-wasm = "0.2"
log = "0.4"
hound = "3.5"
flacenc = { version = "0.5", default-features = false }
rusty_mp3 = "1"
rusty_vorbis = "0.1"
ogg = "0.9"
postcard = { version = "1", features = ["use-std"] }
indexmap = { version = "2", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
semver = "1"
url = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "pcm", "wav", "aiff", "opt-simd"] }
uuid = { version = "1", features = ["serde", "js"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
option_option = "allow"
struct_excessive_bools = "allow"
large_enum_variant = "allow"
needless_pass_by_value = "allow"
struct_field_names = "allow"

# Keep workspace crates fast to rebuild in debug builds while compiling the
# audio-heavy dependencies with optimizations. This makes debug imports and
# resampling usable without giving up incremental builds for local code.
[profile.dev.package."*"]
opt-level = 2

# Resampling and audio hashing are hot in debug imports and use generic rubato
# paths that are instantiated inside this crate, so optimize it specifically
# while leaving the rest of the workspace cheap to rebuild.
[profile.dev.package.notwig-project]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
