[package]
name = "notwig-ext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["native"]
native = ["dep:wasmtime", "dep:libloading"]
web = ["dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]

[dependencies]
notwig-core = { workspace = true, default-features = false }
notwig-ext-api.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
postcard.workspace = true
tracing.workspace = true
zip.workspace = true
wasmtime = { version = "34", default-features = false, features = [
  "cranelift",
  "runtime",
  "std",
], optional = true }
libloading = { version = "0.8", optional = true }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

[dev-dependencies]
uuid = { workspace = true, features = ["v4"] }
wat = "1"

[lints]
workspace = true
