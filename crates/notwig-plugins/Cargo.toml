[package]
name = "notwig-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
au = ["notwig-rack/au"]
au3 = ["notwig-rack/au3"]
clap = ["notwig-rack/clap"]
lv2 = ["notwig-rack/lv2"]
vst3 = ["notwig-rack/vst3"]
vst2 = ["notwig-rack/vst2"]
ara = ["notwig-rack/ara"]

[dependencies]
notwig-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
notwig-rack = { path = "../notwig-rack/notwig-rack", default-features = false, optional = true }
notwig-rack-editor = { path = "../notwig-rack/notwig-rack-editor" }

[dev-dependencies]
hound.workspace = true
image.workspace = true

[lints]
workspace = true

[[test]]
name = "plugin_editor"
path = "tests/plugin_editor.rs"
harness = false

[[test]]
name = "plugin_format_parity"
path = "tests/plugin_format_parity.rs"
harness = false
