[package]
name = "notwig-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
au = ["notwig-rack/au"]
vst3 = ["notwig-rack/vst3"]
vst2 = ["notwig-rack/vst2"]

[dependencies]
notwig-core.workspace = true
notwig-dsp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
notwig-rack = { path = "../notwig-rack/notwig-rack", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "block2"] }
objc2-foundation = "0.3"
block2 = "0.6"

[lints]
workspace = true
