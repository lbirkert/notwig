[package]
name = "notwig-rack-vst3"
version = "1.1.5"
edition = "2024"
rust-version = "1.90"
description = "VST3 host implementation for the notwig-rack audio-plugin framework"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lbirkert/notwig"

[lib]
name = "notwig_rack_vst3"
path = "src/lib.rs"

[dependencies]
libloading = "0.8"
notwig-rack-core = { path = "../notwig-rack-core" }
thiserror = "2.0"
tracing = "0.1"
vst3 = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"

[lints.clippy.pedantic]
level = "warn"
priority = -1
