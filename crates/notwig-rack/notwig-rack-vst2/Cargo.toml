[package]
name = "notwig-rack-vst2"
version = "1.1.5"
edition = "2024"
rust-version = "1.90"
description = "VST 2.4 host implementation for the notwig-rack audio-plugin framework"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lbirkert/notwig"

[lib]
name = "notwig_rack_vst2"
path = "src/lib.rs"

[dependencies]
crossbeam-queue = "0.3"
libloading = "0.8"
notwig-rack-core = { path = "../notwig-rack-core" }
tracing = "0.1"

[lints.clippy.pedantic]
level = "warn"
priority = -1

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
