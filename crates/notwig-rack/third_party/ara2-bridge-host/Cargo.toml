[package]
name = "ara2-bridge-host"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
description = "Safe ARA host authoring runtime (Notwig fork with document/source accessors)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/entrepeneur4lyf/ara2-bridge"
readme = "README.md"

[lib]
name = "ara2_bridge_host"
path = "src/lib.rs"

[dependencies]
ara2-bridge-core = "=0.3.0"
ara2-bridge-sys = "=0.3.0"
bitflags = "2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
