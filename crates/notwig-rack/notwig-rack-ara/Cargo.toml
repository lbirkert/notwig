[package]
name = "notwig-rack-ara"
version = "1.1.5"
edition = "2024"
rust-version = "1.90"
description = "ARA (Audio Random Access) host support for the notwig-rack audio-plugin framework"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lbirkert/notwig"

[lib]
name = "notwig_rack_ara"
path = "src/lib.rs"

[dependencies]
ara2-bridge-core = "=0.3.0"
ara2-bridge-host = { path = "../third_party/ara2-bridge-host" }
ara2-bridge-sys = "=0.3.0"
bitflags = "2"
tracing = "0.1"

[dev-dependencies]
ara2-bridge-plugin = "=0.3.0"
ara2-bridge-testkit = "=0.3.0"

[lints.clippy.pedantic]
level = "warn"
priority = -1
