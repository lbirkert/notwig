[package]
name = "notwig-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "notwig"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native", "au", "clap", "vst"]
native = []
au = ["notwig-plugins/au", "notwig-plugins/au3"]
clap = ["notwig-plugins/clap"]
vst = ["notwig-plugins/vst2", "notwig-plugins/vst3"]
lv2 = ["notwig-plugins/lv2"]
web = []

[dependencies]
notwig-core.workspace = true
notwig-project.workspace = true
notwig-ext-api.workspace = true
notwig-ext = { workspace = true, default-features = false }
notwig-engine.workspace = true
notwig-plugins = { workspace = true, default-features = false }
notwig-ui.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = { version = "1", features = ["use-std"] }
sha2 = "0.10"
url.workspace = true
thiserror.workspace = true
tracing.workspace = true
hound.workspace = true
uuid = { workspace = true, features = ["v4"] }
eframe.workspace = true
egui.workspace = true
cpal.workspace = true
crossbeam-queue.workspace = true
rfd.workspace = true
wgpu.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap.workspace = true
mouse_position.workspace = true
ureq.workspace = true
tracing-subscriber.workspace = true
notwig-plugins.workspace = true
notwig-ext = { workspace = true, features = ["native"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
notwig-core = { workspace = true, features = ["wasm"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys.workspace = true
web-time.workspace = true
tracing-wasm.workspace = true
tracing-subscriber.workspace = true
notwig-ext = { workspace = true, default-features = false, features = ["web"] }

[lints]
workspace = true
