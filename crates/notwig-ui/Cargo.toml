[package]
name = "notwig-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["app"]
extension-ui = ["dep:notwig-ext-api"]
app = [
  "dep:image",
  "dep:notwig-ext-api",
  "dep:notwig-project",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:uuid",
]

[dependencies]
notwig-core = { workspace = true, default-features = false }
notwig-ext-api = { workspace = true, optional = true }
notwig-project = { workspace = true, optional = true }
egui.workspace = true
image = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }

[lints]
workspace = true

[dev-dependencies]
uuid = { workspace = true, features = ["v4"] }
